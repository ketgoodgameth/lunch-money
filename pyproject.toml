[project]
name = "xautest"
version = "0.1.0"
description = "XAU/USD tick-level backtesting and live forward testing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
xautest = "xautest.cli:main"

[tool.setuptools]
packages = ["xautest", "xautest.feeds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
